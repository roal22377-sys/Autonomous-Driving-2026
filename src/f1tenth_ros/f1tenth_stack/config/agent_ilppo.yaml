# IL + PPO (PPO fine-tuned from IL run 11). Select on the car with
#   MODEL=ilppo tools/drive_session.sh   or      MODEL=ilppo tools/run_car.sh use_agent:=true
# Set algo_idx to the PPO run that was saved (results/ppo_s2r/<algo_idx>/sim2real) before driving.
agent_node:
  ros__parameters:
    name: ppo_s2r
    algo_idx: 12190      # 11/26: PPO 12 update 190 (stable; results/ppo_s2r/12190/README.md). Was 5 (PPO 5 u100)
    scan_topic: scan
    drive_topic: drive
    odom_topic: odom
    speed_limit: 8.0    # [m/s] 11/26 Practice1126: 4.0 drove 143 m with no contact (run_1126_1548) -> 8.0 (user choice; = competition, no cap)
    speed_min: 0.0
    steer_gain_left: 1.0
    steer_gain_right: 1.0
