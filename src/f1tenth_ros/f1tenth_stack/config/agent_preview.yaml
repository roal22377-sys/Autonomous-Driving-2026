# Plan B, MAIN model (11/26 08:40 decision, 3-seed comparison results/reports/compare_1126_0837_*.md):
# PPO 21 update 30 (results/ppo_s2r/2130). Short courses + practice course 99.4 % (IL 13 97.5 %), cap-8 2-lap 30.9 s
# (IL 31.0 s), worst-case 82.6 % (IL 78.0 %), open-space 94.3 % (= IL), long F1 tracks 0.6 % slower than IL.
#   MODEL=preview tools/drive_session.sh
# Plan B (src/f1tenth/MAP_TOOL.md section 4): a model with the track-preview input. It localizes on the course map
# (utils/localizer.py, every scan) and gets the race line / speed plan ahead (utils/preview.py).
#   MODEL=preview tools/drive_session.sh
# course / map_dir: the last mapped course, written by tools/map_session.sh --finish / --rebuild (commit + push them,
# the car reads them from its checkout). Put the car anywhere on the course: the start pose is searched along it at the
# first scan (agent log: "[preview] localization: start at ..."); facing the other way, <course>_rev.npz is used.
# If the localization is lost (agent log "[preview] localization lost"), the model drives on LiDAR alone.
agent_node:
  ros__parameters:
    name: ppo_s2r
    algo_idx: 2130
    scan_topic: scan
    drive_topic: drive
    odom_topic: odom
    speed_limit: 6.0    # [m/s] 11/26: 6.0 (user choice; LiDAR PPO hit the top-left open area at 6 and 8, clean at 4)
    speed_min: 0.0
    steer_gain_left: 1.0
    steer_gain_right: 1.0
    course: src/f1tenth/installation/maps_real/Practice1126b.npz
    map_dir: maps/run_1126_1718
    laser_x: 0.13
    loc_stride: 3
    lost_stop: 0.3      # [s] (only without a fallback) localization lost longer -> speed 0 until found again
    # 11/26: localization lost > lost_switch -> the LiDAR-only PPO 12 u190 drives (143 m clean at cap 4 on Practice1126)
    # at most fallback_speed_limit, while the localization keeps searching; back to the preview model once valid
    fallback_name: ppo_s2r
    fallback_algo_idx: 12190
    fallback_speed_limit: 4.0
    lost_switch: 0.3
