# base
map: null
max_episode_steps: 1000
obs_dim: 55         # must equal lidar.num_beams + (1 if speed_obs.enabled)
action_dim: 2
show_centerline: false

# lidar preprocessing (utils/lidar.py), shared by sim env.py and real agent_node.py
lidar:
  num_beams: 54       # 1080 raw beams -> 54 bins of 20 beams (5 deg each); must divide 1080
  max_range: 10.0     # [m] clip; real Hokuyo UST-10LX max is 10 m (sim default is 30 m)
  min_valid: 0.05     # [m] readings below this, and NaN/inf, are invalid -> max_range
  pooling: min        # min | mean | median over each bin
  noise_std: 0.03     # [m] gaussian noise on raw beams, expert data collection only
  dropout_prob: 0.01  # fraction of raw beams dropped (-> invalid), expert data collection only

# vehicle speed input, appended after lidar (utils/observation.py)
#   sim: linear_vels_x / real: /odom twist.linear.x from vesc_to_odom_node
speed_obs:
  enabled: true
  clip: [0.0, 5.0]          # [m/s] reading is clipped to this range
  noise_std: 0.05           # [m/s] gaussian noise on the reading, expert data collection only
  scale_range: [0.9, 1.1]   # per-episode reading scale error (odom calibration), expert data collection only

# env configs
timestep: 0.025
min_speed: 1.0
max_speed: 4.0
max_steer: 0.48     # calibration
control_input: ["speed", "steering_angle"]
observation_config: {"type": "original"}
reset_config: {"type": "cl_random_static"}

# etc
num_agents: 1
ego_idx: 0