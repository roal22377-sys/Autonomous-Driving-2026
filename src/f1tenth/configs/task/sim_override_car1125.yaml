# PPO simulator override (train_ppo_s2r.py --sim_override): configs/task/f1tenth.yaml sim2real as of 11/25 (11/24 car conditions,
# separate acceleration / braking limits) for policies trained before them (PPO 5 / 12 / IL 11). Only sim2real.
sim2real:
  steer_delay: [0.08, 0.20]   # [s] 11/24 car: command -> yaw best at 0.125-0.15 s; this pure delay + servo gives 0.125 s at 0.10
  steer_delay_nominal: 0.12   #     (was [0.05, 0.20], 0.10)
  # full lock per side [rad]: 11/24 tape 0.50 on both sides (hardware stops); down to 0.45 for the measuring error
  # (11/23 read 0.41, likely with the right side short of its stop). Worst case = the low end.
  steer_left_max: [0.45, 0.50]
  steer_left_max_nominal: 0.50
  steer_right_max: [0.45, 0.50]
  steer_right_max_nominal: 0.50
  # real wheel angle / commanded angle in the mid range (full lock stays 0.41 rad, see utils/env.py step).
  # 11/24: symmetric. The 11/23 left 0.75-0.8 estimate came from one driving log (old calibration, tire slip
  # mixed in) while the circle test showed both sides alike; robust to a mild nonlinearity either side.
  steer_scale_left: [0.80, 1.15]   # 11/24: mid-range response left/right vs sim ~1.05 / ~0.88 after the per-side gains below
  steer_scale_left_nominal: 1.05    # 11/24: left / right residual after the per-side command gains
  steer_scale_right: [0.80, 1.15]
  steer_scale_right_nominal: 0.90
  speed_delay: [0.0, 0.05]    # [s] speed command -> wheel speed (real ~0.03 s)
  speed_delay_nominal: 0.03
  a_max: [2.6, 3.2]           # [m/s^2] acceleration limit (11/24 car 2.7-3.0)
  a_max_nominal: 2.9
  a_brake: [3.3, 4.3]         # [m/s^2] braking limit (11/24 car 3.4-4.2)
  a_brake_nominal: 3.7
  mu_scale: [0.8, 1.3]        # x dynamic.yaml mu 0.65 = 0.52-0.85 (11/24 4 m/s drive: 5.3 m/s^2 p99 without sliding -> >= 0.54) (11/24: >= 0.43 from the calibrated drive, the 11/23 fit
                              #   0.41-0.44 used the 1.35x-low odom speed -> ~0.75-0.8; not measured yet)
  noise_scale: [0.5, 2.0]     # per-episode multiplier on the lidar noise above
  generated_tracks: true      # random width / open-side pockets / both directions (utils/track_gen.py)
  laps_steps: true            # max_episode_steps = enough for `laps` at 1.6 m/s

