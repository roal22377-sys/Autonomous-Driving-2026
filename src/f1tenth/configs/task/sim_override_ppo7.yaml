# PPO 7 (11/24): simulator ranges centered on the calibrated 11/24 car (tools/drive_analysis.py, steer_response.py,
# CAR_RESULTS_1124.md). Merged onto the IL 12 config by train_ppo_s2r.py --sim_override (only these keys change).
sim2real:
  steer_delay: [0.08, 0.20]       # command -> yaw best at 0.125-0.15 s on the car; the sim's 0.10 s pure delay gives 0.125 s
  steer_delay_nominal: 0.12
  a_max: [2.6, 4.3]               # accel 2.7-3.0, brake 3.4-4.2 m/s^2 (one value in the sim for both)
  a_max_nominal: 3.3
  mu_scale: [0.8, 1.3]            # x dynamic.yaml mu 0.65 = 0.52-0.85: the calibrated 4 m/s drive held 5.3 m/s^2 (p99) -> mu >= 0.54
  steer_scale_left_nominal: 1.05  # left / right mid-range response after the per-side command gains (0.866 / 1.012)
  steer_scale_right_nominal: 0.90
