# PPO 18 (11/25 night): a FAST preview candidate. PPO 14-17 (friction x0.80-1.30, 15-25 % hard episodes) became robust
# (worst-case 83 -> 95 %) but 3-8 % slower than IL 13 at nominal: the IL expert knows each episode's grip, the policy
# does not, so PPO slows down everywhere. Here the friction range starts at the car's measured lower bound
# (11/24: >= 0.54 = x0.83 of mu 0.65) and hard episodes are rare (--hard_prob 0.05): speed at nominal first.
# Localization noise as sim_override_preview_lost2.yaml.
sim2real:
  mu_scale: [0.85, 1.3]
track_preview:
  noise:
    xy_std: 0.05
    yaw_std_deg: 1.0
    corr_time: 0.5
    jitter_xy: 0.01
    jump_prob: 0.0005
    jump_std: 0.3
    jump_time: 1.0
    lost_episode_prob: 0.25
    lost_rate: 0.05
    lost_len: [0.5, 4.0]
    lost_full_prob: 0.03
